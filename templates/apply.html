{% extends "base.html" %}

{% block title %}信息自主申报{% endblock %}

{% block content %}
<div class="card">
    <div class="header">
        <h1>📝 电子代表证信息申报</h1>
        <p>请认真填写以下信息并上传照片</p>
    </div>
    
    <form method="POST" enctype="multipart/form-data" id="applyForm">
        <div class="form-group">
            <label>姓名 <span class="required">*</span></label>
            <input type="text" name="name" placeholder="请输入真实姓名" required>
        </div>
        
        <div class="form-group">
            <label>学号 <span class="required">*</span></label>
            <input type="text" name="student_id" placeholder="请输入学号" required>
        </div>
        
        <div class="form-group">
            <label>性别</label>
            <select name="gender">
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>政治面貌</label>
            <select name="political_status">
                <option value="">请选择</option>
                <option value="共青团员">共青团员</option>
                <option value="中共党员">中共党员</option>
                <option value="群众">群众</option>
                <option value="其他">其他</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>代表类型 <span class="required">*</span></label>
            <select name="delegation_type" id="delegationType" required onchange="updateDelegationOptions()">
                <option value="">请选择</option>
                <option value="正式代表">正式代表</option>
                <option value="列席代表">列席代表</option>
                <option value="旁听">旁听</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>代表团 <span class="required">*</span></label>
            <select name="delegation" id="delegationSelect" required>
                <option value="">请先选择代表类型</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>班级 <span class="required">*</span></label>
            <select name="class_name" required>
                <option value="">请选择班级</option>
                <option value="2024级大数据技术一班">2024级大数据技术一班</option>
                <option value="2024级大数据技术二班">2024级大数据技术二班</option>
                <option value="2024级云计算应用技术班">2024级云计算应用技术班</option>
                <option value="2024级物联网应用技术班">2024级物联网应用技术班</option>
                <option value="2024级人工智能应用技术一班">2024级人工智能应用技术一班</option>
                <option value="2024级人工智能应用技术二班">2024级人工智能应用技术二班</option>
                <option value="2025级人工智能应用技术一班">2025级人工智能应用技术一班</option>
                <option value="2025级人工智能应用技术二班">2025级人工智能应用技术二班</option>
                <option value="2025级云计算应用技术班">2025级云计算应用技术班</option>
                <option value="2025级大数据技术一班">2025级大数据技术一班</option>
                <option value="2025级大数据技术二班">2025级大数据技术二班</option>
                <option value="2025级物联网应用技术一班">2025级物联网应用技术一班</option>
                <option value="2025级物联网应用技术二班">2025级物联网应用技术二班</option>
                <option value="2025级工业互联网班">2025级工业互联网班</option>
                <option value="校团委">校团委</option>
                <option value="信息科技学院分团委">信息科技学院分团委</option>
                <option value="金融学院分团委">金融学院分团委</option>
                <option value="财税学院分团委">财税学院分团委</option>
                <option value="数字商务学院分团委">数字商务学院分团委</option>
                <option value="文化旅游学院分团委">文化旅游学院分团委</option>
                <option value="会计学院分团委">会计学院分团委</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>免冠照片 (小于5MB) <span class="required">*</span></label>
            <div style="border: 2px dashed #ccc; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s;" id="photoUploadArea" onclick="document.getElementById('photoInput').click()">
                <div style="font-size: 40px; margin-bottom: 10px;">📷</div>
                <p style="color: #666; margin-bottom: 5px;">点击上传照片</p>
                <p style="color: #999; font-size: 12px;">支持 JPG、PNG 格式，小于5MB</p>
                <input type="file" name="photo" accept="image/*" id="photoInput" required style="display: none;">
            </div>
            <div class="photo-preview" id="photoPreview" style="display: none; margin-top: 15px;">
                <img id="previewImg" src="" alt="预览" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <p id="photoName" style="color: #666; font-size: 14px; margin-top: 10px; text-align: center;"></p>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">提交信息</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: #666; text-decoration: none;">← 返回首页</a>
    </div>
</div>

<script>
document.getElementById('photoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        if (file.size > 5 * 1024 * 1024) {
            alert('照片大小不能超过5MB');
            this.value = '';
            return;
        }
        
        // 显示文件名
        document.getElementById('photoName').textContent = '已选择: ' + file.name;
        
        // 显示预览
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImg').src = e.target.result;
            document.getElementById('photoPreview').style.display = 'flex';
            document.getElementById('photoUploadArea').style.borderColor = '#C41E3A';
            document.getElementById('photoUploadArea').style.background = '#fff5f5';
        }
        reader.readAsDataURL(file);
    }
});

// 拖拽上传
document.getElementById('photoUploadArea').addEventListener('dragover', function(e) {
    e.preventDefault();
    this.style.borderColor = '#C41E3A';
    this.style.background = '#fff5f5';
});

document.getElementById('photoUploadArea').addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.style.borderColor = '#ccc';
    this.style.background = 'white';
});

document.getElementById('photoUploadArea').addEventListener('drop', function(e) {
    e.preventDefault();
    this.style.borderColor = '#ccc';
    this.style.background = 'white';
    
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        document.getElementById('photoInput').files = e.dataTransfer.files;
        document.getElementById('photoInput').dispatchEvent(new Event('change'));
    }
});

// 代表团联动
function updateDelegationOptions() {
    const type = document.getElementById('delegationType').value;
    const select = document.getElementById('delegationSelect');
    
    select.innerHTML = '<option value="">请选择代表团</option>';
    
    if (type === '正式代表') {
        const options = ['第一代表团', '第二代表团', '第三代表团', '第四代表团'];
        options.forEach(opt => {
            select.innerHTML += '<option value="' + opt + '">' + opt + '</option>';
        });
    } else if (type === '列席代表') {
        select.innerHTML += '<option value="列席代表团">列席代表团</option>';
    } else if (type === '旁听') {
        select.innerHTML += '<option value="旁听席">旁听席</option>';
    }
}
</script>
{% endblock %}
