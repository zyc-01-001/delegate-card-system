{% extends "base.html" %}

{% block title %}提交成功{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 60px 30px;">
    <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
    <h1 style="color: #28a745; margin-bottom: 15px;">提交成功！</h1>
    <p style="color: #666; margin-bottom: 30px; line-height: 1.8;">
        您的信息已成功提交，请等待管理员审核。<br>
        审核通过后，您可以通过"查询代表证"功能查看您的电子代表证。
    </p>
    
    <div style="margin-top: 30px;">
        <a href="{{ url_for('query') }}" class="btn btn-primary">查询代表证</a>
        <a href="{{ url_for('index') }}" class="btn btn-info" style="margin-left: 10px;">返回首页</a>
    </div>
</div>
{% endblock %}
